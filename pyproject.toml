[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sreqcheck"
version = "0.1.0"
description = "Compare your Linux PC with a Steam game's system requirements (for Proton gaming)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.28",
    "rich>=13",
    "beautifulsoup4>=4.11",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
sreqcheck = "sreqcheck.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sreqcheck = ["data/*.csv"]
